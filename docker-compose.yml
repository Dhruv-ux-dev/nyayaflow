# Local development: `docker compose up -d db` starts only PostgreSQL.
# Full stack (database + API + web UI): `docker compose --profile app up --build`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nyayaflow
      POSTGRES_USER: ${DB_USERNAME:-nyayaflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nyayaflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/nyayaflow
      DB_USERNAME: ${DB_USERNAME:-nyayaflow}
      DB_PASSWORD: ${DB_PASSWORD:-nyayaflow}
      NYAYAFLOW_JWT_SECRET: ${NYAYAFLOW_JWT_SECRET:-}
      NYAYAFLOW_STORAGE_LOCATION: /data/uploads
      NYAYAFLOW_SEED_DEMO_DATA: ${NYAYAFLOW_SEED_DEMO_DATA:-true}
      NYAYAFLOW_CORS_ALLOWED_ORIGINS: http://localhost:8081
    volumes:
      - uploads:/data/uploads

  frontend:
    profiles: ["app"]
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:
  uploads:
