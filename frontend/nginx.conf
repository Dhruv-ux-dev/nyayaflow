server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API responses carry their own security headers from Spring Security.
    location /api/ {
        # The API's whole-request limit (NYAYAFLOW_MAX_REQUEST_SIZE). Oversize uploads are refused here
        # at once, in the API's error format, instead of being streamed to the API first.
        client_max_body_size 21m;
        error_page 413 = @upload_too_large;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @upload_too_large {
        default_type application/json;
        return 413 '{"status":413,"code":"FILE_TOO_LARGE","message":"The file exceeds the maximum allowed upload size."}';
    }

    # Hashed build assets never change. (nginx does not inherit add_header into a location
    # that declares its own, so the security headers are repeated in each static location.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
