# Keeps the free Render backend awake from 8 AM to midnight IST, so the
# live demo opens without a cold start. Off from midnight to 8 AM IST.
#
# GitHub's cron is often late or skipped, so one run loops and pings every
# 9 minutes for up to ~5.5 hours, then starts the next run itself while
# still inside the window. The cron entries only restart the chain.
name: Keep demo awake

on:
  schedule:
    - cron: "30 2 * * *"            # 8:00 AM IST
    - cron: "0 6,10,14,18 * * *"    # backups in case the chain breaks
  workflow_dispatch:

concurrency:
  group: keep-awake

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping every 9 minutes while inside the window
        run: |
          in_window() { h=$(TZ=Asia/Kolkata date +%-H); [ "$h" -ge 8 ]; }
          start=$(date +%s)
          while in_window && [ $(( $(date +%s) - start )) -lt 19800 ]; do
            curl -sS -o /dev/null -w "api %{http_code} %{time_total}s\n" -m 240 https://nyayaflow-api-1ayc.onrender.com/actuator/health || true
            curl -sS -o /dev/null -w "web %{http_code}\n" -m 60 https://nyayaflow-lsm2.onrender.com || true
            sleep 540
          done
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Asia/Kolkata date +%-H)
          if [ "$h" -ge 8 ]; then gh workflow run keep-awake.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
