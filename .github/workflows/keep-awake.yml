# Keeps the free Render backend awake from 8 AM to midnight IST, so the
# live demo opens without a cold start. Off from midnight to 8 AM IST.
name: Keep demo awake

on:
  schedule:
    # Every 10 min, 02:00-18:59 UTC (about 7:30 AM - 12:30 AM IST)
    - cron: "*/10 2-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: curl -fsS -m 240 --retry 2 https://nyayaflow-api-1ayc.onrender.com/actuator/health
      - name: Ping frontend
        run: curl -fsS -m 60 -o /dev/null https://nyayaflow-lsm2.onrender.com
